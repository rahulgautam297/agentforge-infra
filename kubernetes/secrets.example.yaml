# Copy to secrets.yaml (gitignored -- see kustomization.yaml) and change
# every value before applying to any cluster that isn't purely throwaway.
# Mirrors the dev defaults in ../.env.example -- same three passwords, same
# "Phase-1 auth shim" bearer token, now as a real Secret instead of a
# docker-compose environment block.
#
# `control-plane-database-url` / `execution-platform-database-url` carry the
# password pre-embedded in the DSN (Postgres connection strings, not just
# the bare password) because plain Kubernetes env vars don't do
# `${VAR}`-style interpolation the way docker-compose's `${POSTGRES_PASSWORD}`
# does -- if you rotate `postgres-password`/`execution-role-password` below,
# regenerate both DSNs to match, they won't update themselves.
apiVersion: v1
kind: Secret
metadata:
  name: agentforge-credentials
  namespace: agentforge
type: Opaque
stringData:
  postgres-password: agentforge_dev_password
  execution-role-password: execution_dev_password
  dev-bearer-token: dev-local-token
  control-plane-database-url: "postgresql+psycopg://agentforge:agentforge_dev_password@db:5432/agentforge"
  execution-platform-database-url: "postgresql+psycopg://agentforge_execution:execution_dev_password@db:5432/agentforge"
