# Single-node OpenSearch, security plugin disabled -- same dev-grade config
# as docker-compose's `opensearch` service (see agentforge-docs doc07/ADR-
# 0007: production topology for OpenSearch is explicitly a later
# infrastructure concern, not resolved in this pass either). The
# `sysctl` initContainer sets vm.max_map_count, which OpenSearch's JVM
# requires on the underlying node; it needs a privileged securityContext,
# so it will fail on a cluster whose Pod Security admission forbids that --
# in that case, set vm.max_map_count>=262144 on the node image/bootstrap
# instead and drop this initContainer.
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: agentforge
  labels:
    app: opensearch
spec:
  clusterIP: None
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: agentforge
  labels:
    app: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
