# TimescaleDB primary -- single instance, no read replicas (see
# ../../agentforge-docs/docs/architecture/13-risks.md's "Read replicas /
# connection pooling", explicitly deferred past this phase). A headless
# Service gives it the same stable DNS name ("db") that docker-compose gave
# it for free, which every other manifest's DATABASE_URL/dependency wiring
# already assumes.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: agentforge
  labels:
    app: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: agentforge
  labels:
    app: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: agentforge
            - name: POSTGRES_USER
              value: agentforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentforge-credentials
                  key: postgres-password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentforge", "-d", "agentforge"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agentforge", "-d", "agentforge"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
