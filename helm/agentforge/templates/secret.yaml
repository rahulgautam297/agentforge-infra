{{/*
Skipped entirely when credentials.existingSecret is set -- see
_helpers.tpl's agentforge.secretName and values.yaml's own comment. Same
DSN-embeds-the-password reasoning as kubernetes/secrets.example.yaml:
plain env vars don't do ${VAR} interpolation the way docker-compose's do,
so control-plane/execution-platform's DATABASE_URL has to be built here,
once, rather than assembled from parts at the pod level.
*/}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentforge.secretName" . }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.credentials.postgresPassword | quote }}
  execution-role-password: {{ .Values.credentials.executionRolePassword | quote }}
  dev-bearer-token: {{ .Values.credentials.devBearerToken | quote }}
  aws-region: {{ .Values.credentials.awsRegion | quote }}
  aws-access-key-id: {{ .Values.credentials.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ .Values.credentials.awsSecretAccessKey | quote }}
  control-plane-database-url: {{ printf "postgresql+psycopg://agentforge:%s@%s-db:5432/agentforge" .Values.credentials.postgresPassword (include "agentforge.fullname" .) | quote }}
  execution-platform-database-url: {{ printf "postgresql+psycopg://agentforge_execution:%s@%s-db:5432/agentforge" .Values.credentials.executionRolePassword (include "agentforge.fullname" .) | quote }}
{{- end }}
