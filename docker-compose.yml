services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge_dev_password}
    ports: ["5432:5432"]
    volumes: ["agentforge-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ../agentforge-control-plane
    environment:
      DATABASE_URL: postgresql+psycopg://agentforge:${POSTGRES_PASSWORD:-agentforge_dev_password}@db:5432/agentforge
      EXECUTION_ROLE_PASSWORD: ${EXECUTION_ROLE_PASSWORD:-execution_dev_password}
      DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-local-token}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  execution-platform:
    build:
      context: ../agentforge-agent-execution-platform
    environment:
      DATABASE_URL: postgresql+psycopg://agentforge_execution:${EXECUTION_ROLE_PASSWORD:-execution_dev_password}@db:5432/agentforge
      CONTROL_PLANE_URL: http://control-plane:8000/api/v1
      DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-local-token}
      CORS_ORIGINS: http://localhost:3000
      OPENSEARCH_URL: http://opensearch:9200
      TEMPORAL_HOST: temporal:7233
      # Phase 10: read by boto3's default credential chain inside
      # providers/bedrock.py's BedrockProvider -- never touched by
      # config.py's Settings (no access-key/secret field exists there on
      # purpose, see that file's own comment). Empty defaults so a compose
      # stack with no .env AWS_* values still starts cleanly for
      # mock-only agents; only an agent whose YAML declares
      # model.provider: bedrock actually needs these populated.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Same "empty default, only needed if an agent YAML actually
      # declares this provider" pattern as the AWS_* vars above -- these
      # existed as config.py Settings fields (OPENAI_API_KEY since Phase
      # 10) but were never actually passed through docker-compose until
      # now, a pre-existing gap this fix closes for all three at once.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["8001:8001"]
    depends_on:
      control-plane: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      temporal: { condition: service_healthy }

  # Phase 6: Temporal -- wraps `durable`/`human_in_loop` graph invocations
  # (see agentforge-docs doc05/ADR-0004). SDK/gRPC on 7233, used by both
  # the execution-platform's in-process Worker and its router's Client --
  # see temporal_worker.py / main.py.
  #
  # Real persistence (temporalio/auto-setup against the same Postgres
  # instance as `db`, in its own `temporal`/`temporal_visibility`
  # databases -- distinct databases, zero shared tables with `agentforge`,
  # same "separate storage" split doc05 already documents). Not
  # `start-dev`: that mode is in-memory with no volume at all, so a
  # container restart silently loses every workflow's history, including
  # any human_in_loop execution genuinely mid-pause on an approval --
  # see doc14's outstanding-gaps entry on this. auto-setup provisions the
  # schema itself on first boot (needs CREATEDB on the given Postgres
  # role, which `agentforge` already has as the DB's init user).
  # temporalio/auto-setup is Temporal's own documented "not for true
  # production scale" image (it re-checks schema on every boot) --
  # accepted here as the right-sized tradeoff for this project, same
  # choice the official temporalio/docker-compose examples make; a real
  # production deployment would provision schema once via
  # temporal-sql-tool and run the plain temporalio/server image instead.
  temporal:
    image: temporalio/auto-setup:1.28.0
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=agentforge
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-agentforge_dev_password}
      - POSTGRES_SEEDS=db
    ports: ["7233:7233"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # start-dev bundled a lightweight UI on 8233 for free; the real server
  # image doesn't, so this is now a separate container pointed at the
  # same frontend.
  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports: ["8233:8080"]
    depends_on:
      temporal: { condition: service_healthy }

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ../agentforge-frontend
      # Local dev always builds the `dev` stage (hot reload, `pnpm dev`,
      # NEXT_PUBLIC_* read at container start via `environment:` below).
      # A deployment wanting the production stage instead overrides this
      # to `runner` (see the EC2 deploy's docker-compose.override.yml) --
      # that target needs the same NEXT_PUBLIC_* values as build ARGs
      # too, since `next build` inlines them at build time rather than
      # reading them at server start the way `next dev` does.
      target: dev
      args:
        NEXT_PUBLIC_CONTROL_PLANE_URL: ${NEXT_PUBLIC_CONTROL_PLANE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_EXECUTION_PLANE_URL: ${NEXT_PUBLIC_EXECUTION_PLANE_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-local-token}
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: ${NEXT_PUBLIC_CONTROL_PLANE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_EXECUTION_PLANE_URL: ${NEXT_PUBLIC_EXECUTION_PLANE_URL:-http://localhost:8001/api/v1}
      NEXT_PUBLIC_DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-local-token}
    ports: ["3000:3000"]
    depends_on:
      control-plane: { condition: service_healthy }
      execution-platform: { condition: service_started }

  # Phase 5 Observability: execution-platform exports metrics directly to
  # Prometheus (doc11's local-dev diagram: `ep --> prom`, no collector
  # service in between) via prometheus_client's GET /metrics.
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      execution-platform: { condition: service_started }

  # Host port 3001, not 3000 -- 3000 is already the frontend.
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3001:3000"]
    environment:
      # Defaults preserve today's local-dev convenience (anonymous Admin,
      # no login needed). A public deployment overrides these -- see the
      # EC2 deploy's .env/docker-compose.override.yml -- since anonymous
      # Admin access lets anyone reach it add data sources (a known SSRF
      # vector) or delete/edit dashboards, not just view them.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANONYMOUS_ORG_ROLE:-Admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  agentforge-db-data:
