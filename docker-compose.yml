services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge_dev_password}
    ports: ["5432:5432"]
    volumes: ["agentforge-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ../agentforge-control-plane
    environment:
      DATABASE_URL: postgresql+psycopg://agentforge:${POSTGRES_PASSWORD:-agentforge_dev_password}@db:5432/agentforge
      EXECUTION_ROLE_PASSWORD: ${EXECUTION_ROLE_PASSWORD:-execution_dev_password}
      DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-local-token}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  execution-platform:
    build:
      context: ../agentforge-agent-execution-platform
    environment:
      DATABASE_URL: postgresql+psycopg://agentforge_execution:${EXECUTION_ROLE_PASSWORD:-execution_dev_password}@db:5432/agentforge
      CONTROL_PLANE_URL: http://control-plane:8000/api/v1
      DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-local-token}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8001:8001"]
    depends_on:
      control-plane: { condition: service_healthy }

volumes:
  agentforge-db-data:
